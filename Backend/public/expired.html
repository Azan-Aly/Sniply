<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Expired — Sniply</title>
  <meta name="description" content="This shortened link has expired and is no longer available." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Animated gradient background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 600px at 20% 30%, rgba(16, 185, 129, 0.08), transparent),
        radial-gradient(ellipse 500px 500px at 80% 70%, rgba(20, 184, 166, 0.06), transparent),
        radial-gradient(ellipse 400px 400px at 50% 50%, rgba(6, 182, 212, 0.04), transparent);
      animation: bgShift 8s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: float 6s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 300px; height: 300px;
      background: rgba(16, 185, 129, 0.12);
      top: -80px; left: -60px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 250px; height: 250px;
      background: rgba(20, 184, 166, 0.10);
      bottom: -60px; right: -40px;
      animation-delay: -3s;
    }
    .orb-3 {
      width: 180px; height: 180px;
      background: rgba(6, 182, 212, 0.08);
      top: 50%; left: 60%;
      animation-delay: -1.5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, -30px) scale(1.1); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      max-width: 480px;
      width: 90%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(51, 65, 85, 0.4);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 25px 50px -12px rgba(0,0,0,0.5);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Hourglass icon container */
    .icon-wrap {
      width: 80px; height: 80px;
      margin: 0 auto 28px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(20,184,166,0.10));
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: iconPulse 3s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.15); }
      50% { box-shadow: 0 0 0 12px rgba(16,185,129,0); }
    }

    .icon-wrap svg {
      width: 36px; height: 36px;
      color: #10b981;
      animation: hourglassSpin 4s ease-in-out infinite;
    }

    @keyframes hourglassSpin {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(180deg); }
      50% { transform: rotate(180deg); }
      75% { transform: rotate(360deg); }
      100% { transform: rotate(360deg); }
    }

    /* Brand */
    .brand {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #10b981, #14b8a6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #f1f5f9;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      font-weight: 500;
      margin-bottom: 32px;
    }

    /* Status pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 700;
      color: #f87171;
      letter-spacing: 0.5px;
      margin-bottom: 28px;
    }

    .status-pill .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* CTA Button */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #10b981, #14b8a6);
      color: white;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.35);
    }

    .cta:active {
      transform: translateY(0);
    }

    .cta svg {
      width: 16px; height: 16px;
      transition: transform 0.2s ease;
    }

    .cta:hover svg {
      transform: translateX(3px);
    }

    /* Footer */
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #475569;
      font-weight: 500;
    }

    .footer a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">
    <div class="brand">Sniply</div>

    <div class="icon-wrap">
      <!-- Hourglass SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 22h14"/>
        <path d="M5 2h14"/>
        <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/>
        <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>
      </svg>
    </div>

    <div class="status-pill">
      <span class="dot"></span>
      LINK EXPIRED
    </div>

    <h1>This Link Has Expired</h1>
    <p class="subtitle">
      The shortened URL you're trying to visit is no longer active. The link owner set an expiration date, and it has since passed.
    </p>

    <a href="http://localhost:5173" class="cta">
      Go to Sniply Homepage
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/>
        <path d="m12 5 7 7-7 7"/>
      </svg>
    </a>

    <p class="footer">
      Need a new link? <a href="http://localhost:5173">Create one now</a>
    </p>
  </div>
</body>
</html>
